name: "Build runner image"

# Repositório PÚBLICO: roda em runner hospedado (grátis). Nunca usar self-hosted aqui.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # semanal (segunda): pega correções da base e do Ubuntu

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lema-ufpb/actions-runner

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolver versão do runner e tag de build
        id: ver
        run: |
          runner=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile | head -n1)
          [ -n "$runner" ] || { echo "RUNNER_VERSION não encontrado no Dockerfile" >&2; exit 1; }
          # N = nº da execução do workflow: monotônico e único, então uma tag nova
          # nunca sobrescreve uma antiga (o cluster fixa `<runner>-lema.N`, não `latest`).
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "tag=$runner-lema.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (carrega local para escanear antes de publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (HIGH/CRITICAL com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          ignore-unfixed: true
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Publicar (mesmo build, do cache) com SBOM e provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
